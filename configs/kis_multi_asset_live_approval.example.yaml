mode: live_approval

portfolio:
  base_currency: KRW
  allocation_mode: currency_sleeves
  initial_cash: 1000000
  cash_by_currency:
    KRW: 1000000
    USD: 10000
  allowed_symbols:
    - CASH_KRW
    - CASH_USD
    - SAMSUNG
    - KODEX200
    - AAPL
    - VOO
  currency_sleeves:
    KRW:
      cash_symbol: CASH_KRW
      symbols: [SAMSUNG, KODEX200]
    USD:
      cash_symbol: CASH_USD
      symbols: [AAPL, VOO]

universe:
  policy:
    allowed_asset_types: [stock, etf, domestic_etf, us_etf]
    allowed_regions: [KR, US]
    allowed_currencies: [KRW, USD]
    allowed_broker_products: [kis_domestic_stock, kis_overseas_stock]
    allowed_exchange_codes: [KRX, NASD, AMEX]
    denied_symbols: []
    denied_asset_tags: []
    max_new_symbols_per_run: 1
    require_operator_approval_for_tradable: true
    require_broker_tradability_check: true
    require_data_freshness_check: true
  instruments:
    - symbol: CASH_KRW
      asset_type: cash
      region: KR
      currency: KRW
      broker: kis
      broker_product: kis_domestic_stock
      broker_symbol: KRW
      quantity_step: 1
      price_tick: 1
      min_order_quantity: 1
      min_order_notional: 0
    - symbol: CASH_USD
      asset_type: cash
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: USD
      quantity_step: 0.01
      price_tick: 0.01
      min_order_quantity: 0.01
      min_order_notional: 0
    - symbol: SAMSUNG
      asset_type: stock
      region: KR
      currency: KRW
      broker: kis
      broker_product: kis_domestic_stock
      broker_symbol: "005930"
      exchange_code: KRX
      quantity_step: 1
      price_tick: 1
      min_order_quantity: 1
      min_order_notional: 1
    - symbol: KODEX200
      asset_type: domestic_etf
      region: KR
      currency: KRW
      broker: kis
      broker_product: kis_domestic_stock
      broker_symbol: "069500"
      exchange_code: KRX
      quantity_step: 1
      price_tick: 5
      min_order_quantity: 1
      min_order_notional: 1
    - symbol: AAPL
      asset_type: stock
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: AAPL
      exchange_code: NASD
      quantity_step: 1
      price_tick: 0.01
      min_order_quantity: 1
      min_order_notional: 1
    - symbol: VOO
      asset_type: etf
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: VOO
      exchange_code: AMEX
      quantity_step: 1
      price_tick: 0.01
      min_order_quantity: 1
      min_order_notional: 1

strategies: []

datahub:
  provider: yahoo
  symbol_map:
    SAMSUNG: 005930.KS
    KODEX200: 069500.KS
    AAPL: AAPL
    VOO: VOO

execution:
  engine: paper
  live_order_enabled: false
  live_order_dry_run: true
  require_reconciliation_pass: true
  max_live_order_notional: 100000
  max_daily_live_notional: 300000
  max_daily_live_order_count: 2
  daily_loss_limit: null
  allowed_order_type: limit
  order_status_poll_interval_seconds: 30
  order_status_max_polls: 20
  order_status_terminal_timeout_seconds: 1800
  require_market_session: false
  market_session_timezone: Asia/Seoul
  market_session_open: "09:00"
  market_session_close: "15:30"
  market_session_weekdays: [0, 1, 2, 3, 4]
  market_session_holidays: []
  require_broker_quote_validation: false
  max_broker_quote_deviation_pct: 0.05
  require_broker_risk_validation: false
  live_order_fee_buffer_pct: 0.002
  heartbeat_max_age_seconds: 0
  scheduled_run_max_age_seconds: 0

risk:
  max_single_asset_weight: 0.5
  min_cash_weight: 0.05

state:
  sqlite_path: var/kis_multi_asset_live_approval_state.db

audit:
  jsonl_path: var/kis_multi_asset_live_approval_audit.jsonl

approval:
  enabled: true
  provider: telegram
  require_approval: true
  default_decision: expired
  timeout_seconds: 300
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_allowed_chat_ids: []
  whitelisted_user_ids: []
  telegram_poll_interval_seconds: 1.0

kis:
  enabled: true
  provider: kis
  broker_products: [kis_domestic_stock, kis_overseas_stock]
  account_id_env: KIS_ACCOUNT_ID
  app_key_env: KIS_APP_KEY
  app_secret_env: KIS_APP_SECRET
  access_token_env: KIS_ACCESS_TOKEN
  token_cache_path: var/kis_access_token.json
  paper_trading: false
  timeout_seconds: 10

reconciliation:
  cash_tolerance: 0.0
  position_quantity_tolerance: 0.0
  value_tolerance: 0.0
  max_age_seconds: 86400
