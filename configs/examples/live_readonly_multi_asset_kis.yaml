mode: live_readonly

portfolio:
  base_currency: KRW
  allocation_mode: currency_sleeves
  cash_by_currency:
    KRW: 1000000
    USD: 10000
  currency_sleeves:
    KRW:
      cash_symbol: CASH_KRW
      symbols: [SAMSUNG, KODEX200]
    USD:
      cash_symbol: CASH_USD
      symbols: [AAPL, VOO]

universe:
  policy:
    allowed_asset_types: [stock, etf, domestic_etf, us_etf]
    allowed_regions: [KR, US]
    allowed_currencies: [KRW, USD]
    allowed_broker_products: [kis_domestic_stock, kis_overseas_stock]
    allowed_exchange_codes: [KRX, NASD, AMEX]
    denied_symbols: []
    denied_asset_tags: []
    max_new_symbols_per_run: 1
    require_operator_approval_for_tradable: true
    require_broker_tradability_check: true
    require_data_freshness_check: true
  instruments:
    - symbol: SAMSUNG
      asset_type: stock
      region: KR
      currency: KRW
      broker: kis
      broker_product: kis_domestic_stock
      broker_symbol: "005930"
      exchange_code: KRX
      quantity_step: 1
      price_tick: 1
      min_order_quantity: 1
      min_order_notional: 1
    - symbol: KODEX200
      asset_type: domestic_etf
      region: KR
      currency: KRW
      broker: kis
      broker_product: kis_domestic_stock
      broker_symbol: "069500"
      exchange_code: KRX
      quantity_step: 1
      price_tick: 5
      min_order_quantity: 1
      min_order_notional: 1
    - symbol: AAPL
      asset_type: stock
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: AAPL
      exchange_code: NASD
      quantity_step: 1
      price_tick: 0.01
      min_order_quantity: 1
      min_order_notional: 1
    - symbol: VOO
      asset_type: etf
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: VOO
      exchange_code: AMEX
      quantity_step: 1
      price_tick: 0.01
      min_order_quantity: 1
      min_order_notional: 1

strategies: []

datahub:
  provider: mock

execution:
  proposal_engine: paper

risk:
  max_single_asset_weight: 0.5
  min_cash_weight: 0.05

state:
  sqlite_path: var/multi_asset_readonly_state.db

audit:
  jsonl_path: var/multi_asset_readonly_audit.jsonl

approval:
  enabled: false
  provider: console
  require_approval: false
  default_decision: approved
  timeout_seconds: 300

kis:
  enabled: true
  provider: kis
  broker_products: [kis_domestic_stock, kis_overseas_stock]
