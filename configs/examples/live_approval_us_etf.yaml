mode: live_approval

portfolio:
  base_currency: USD
  allowed_symbols:
    - CASH_USD
    - AAPL
    - MSFT
    - VOO
    - QQQ

universe:
  policy:
    allowed_asset_types: [stock, etf, us_etf]
    allowed_regions: [US]
    allowed_currencies: [USD]
    allowed_broker_products: [kis_overseas_stock]
    allowed_exchange_codes: [NASD, NYSE, AMEX]
    denied_symbols: []
    denied_asset_tags: []
    max_new_symbols_per_run: 1
    require_operator_approval_for_tradable: true
    require_broker_tradability_check: true
    require_data_freshness_check: true
  instruments:
    - symbol: AAPL
      asset_type: stock
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: AAPL
      exchange_code: NASD
      quantity_step: 1
      price_tick: 0.01
      min_order_quantity: 1
      min_order_notional: 1
    - symbol: MSFT
      asset_type: stock
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: MSFT
      exchange_code: NASD
      quantity_step: 1
      price_tick: 0.01
      min_order_quantity: 1
      min_order_notional: 1
    - symbol: VOO
      asset_type: etf
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: VOO
      exchange_code: AMEX
      quantity_step: 1
      price_tick: 0.01
      min_order_quantity: 1
      min_order_notional: 1
    - symbol: QQQ
      asset_type: etf
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: QQQ
      exchange_code: NASD
      quantity_step: 1
      price_tick: 0.01
      min_order_quantity: 1
      min_order_notional: 1

strategies: []

datahub:
  provider: mock

execution:
  engine: paper
  live_order_enabled: false
  live_order_dry_run: false
  require_reconciliation_pass: true
  live_order_limits:
    max_order_notional: 100
    max_daily_notional: 300
    max_daily_order_count: 3
    daily_loss_limit: null
    fee_buffer_pct: 0.0
  allowed_order_type: limit
  order_status_poll_interval_seconds: 30
  order_status_max_polls: 20
  order_status_terminal_timeout_seconds: 1800
  market_session:
    required: false
    timezone: America/New_York
    open: "09:30"
    close: "16:00"
    weekdays: [0, 1, 2, 3, 4]
    holidays: []
  broker_validation:
    require_quote_validation: false
    max_quote_deviation_pct: 0.05
    require_risk_validation: false

risk:
  max_single_asset_weight: 0.4
  min_cash_weight: 0.05

monitoring:
  heartbeat_max_age_seconds: 0
  scheduled_run_max_age_seconds: 0

state:
  sqlite_path: var/live_approval_us_etf_state.db

audit:
  jsonl_path: var/live_approval_us_etf_audit.jsonl

approval:
  enabled: true
  provider: telegram
  require_approval: true
  default_decision: expired
  timeout_seconds: 300
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_allowed_chat_ids:
    - 123456789
  whitelisted_user_ids:
    - 123456789
  telegram_poll_interval_seconds: 1.0

kis:
  enabled: true
  provider: kis
  broker_product: kis_overseas_stock
  account_id: "00000000-00"
