mode: paper

portfolio:
  base_currency: KRW
  initial_cash: 10000000
  allowed_symbols:
    - CASH
    - MOCK_ETF_A
    - MOCK_ETF_B

strategies:
  - id: sample_static_allocation
    enabled: true
    weight: 1.0
    entrypoint: "sample_static_allocation.strategy:SampleStaticAllocationStrategy"
    config:
      allocations:
        CASH: 0.5
        MOCK_ETF_A: 0.3
        MOCK_ETF_B: 0.2

datahub:
  provider: mock

execution:
  proposal_engine: paper


state:
  sqlite_path: var/approval_state.db

audit:
  jsonl_path: var/approval_audit.jsonl

approval:
  enabled: true
  provider: console
  require_approval: true
  default_decision: approved
  timeout_seconds: 300
  whitelisted_user_ids: []
