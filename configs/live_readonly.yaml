mode: live_readonly

portfolio:
  base_currency: KRW
  allowed_symbols:
    - CASH_KRW

universe:
  instruments:
    - symbol: CASH_KRW
      asset_type: cash
      region: KR
      currency: KRW
      broker: kis
      broker_product: kis_domestic_stock
      broker_symbol: KRW
      exchange_code: KRX
      quantity_step: 1
      price_tick: 1
      min_order_quantity: 1
      min_order_notional: 0

strategies: []

datahub:
  provider: mock

execution:
  engine: paper

risk:
  max_single_asset_weight: 1.0
  min_cash_weight: 0.0

state:
  sqlite_path: var/live_readonly_state.db

audit:
  jsonl_path: var/live_readonly_audit.jsonl

approval:
  enabled: false
  provider: console
  require_approval: false
  default_decision: approved
  timeout_seconds: 300

kis:
  enabled: true
  provider: kis
  broker_product: kis_domestic_stock
  account_id: null
  account_id_env: KIS_ACCOUNT_ID
  app_key_env: KIS_APP_KEY
  app_secret_env: KIS_APP_SECRET
  access_token_env: KIS_ACCESS_TOKEN
  approval_key_env: KIS_APPROVAL_KEY
  token_cache_path: var/kis_access_token.json
  paper_trading: false
  timeout_seconds: 10

reconciliation:
  cash_tolerance: 0.0
  position_quantity_tolerance: 0.0
  value_tolerance: 0.0
  max_age_seconds: 86400
