mode: live_readonly

portfolio:
  base_currency: KRW
  allowed_symbols:
    - CASH_KRW

strategies: []

datahub:
  provider: mock

execution:
  proposal_engine: paper

risk:
  max_single_asset_weight: 1.0
  min_cash_weight: 0.0

state:
  sqlite_path: var/live_readonly_state.db

audit:
  jsonl_path: var/live_readonly_audit.jsonl

approval:
  enabled: false
  provider: console
  require_approval: false
  default_decision: approved
  timeout_seconds: 300

kis:
  enabled: true
  provider: kis
  broker_product: kis_domestic_stock
