mode: live_approval

portfolio:
  base_currency: KRW
  allowed_symbols:
    - CASH_KRW

universe:
  policy:
    allowed_asset_types: [stock, etf, domestic_etf, us_etf]
    allowed_regions: [KR, US]
    allowed_currencies: [KRW, USD]
    allowed_broker_products: [kis_domestic_stock, kis_overseas_stock]
    allowed_exchange_codes: [KRX, NASD, NYSE, AMEX]
    denied_symbols: []
    denied_asset_tags: []
    max_new_symbols_per_run: 1
    require_operator_approval_for_tradable: true
    require_broker_tradability_check: true
    require_data_freshness_check: true

strategies: []

datahub:
  provider: mock

execution:
  proposal_engine: paper
  order_posture: dry_run
  require_reconciliation_pass: true
  live_order_limits:
    max_order_notional: 100
    max_daily_notional: 300
    max_daily_order_count: 3
    daily_loss_limit: null
    fee_buffer_pct: 0.0
  allowed_order_type: limit
  order_status_poll_interval_seconds: 30
  order_status_max_polls: 20
  order_status_terminal_timeout_seconds: 1800
  market_session:
    required: true
    timezone: Asia/Seoul
    open: "09:00"
    close: "15:30"
    weekdays: [0, 1, 2, 3, 4]
    holidays: []
  broker_validation:
    require_quote_validation: true
    max_quote_deviation_pct: 0.05
    require_risk_validation: true


monitoring:
  heartbeat_max_age_seconds: 0
  scheduled_run_max_age_seconds: 0

state:
  sqlite_path: var/live_approval_state.db

audit:
  jsonl_path: var/live_approval_audit.jsonl

approval:
  enabled: true
  provider: telegram
  require_approval: true
  default_decision: expired
  timeout_seconds: 600
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_allowed_chat_ids:
    - 123456789
  whitelisted_user_ids:
    - 123456789
  telegram_poll_interval_seconds: 1.0
  telegram_reminder_seconds: [120, 300, 480]

kis:
  enabled: true
  provider: kis
  broker_products:
    - kis_domestic_stock
