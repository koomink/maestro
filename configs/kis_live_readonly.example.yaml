mode: live_readonly

portfolio:
  base_currency: USD
  initial_cash: 10000
  allowed_symbols:
    - CASH_USD
    - AAPL
    - VOO

universe:
  instruments:
    - symbol: CASH_USD
      asset_type: cash
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: USD
      quantity_step: 0.01
      price_tick: 0.01
      min_order_quantity: 0.01
    - symbol: AAPL
      asset_type: stock
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: AAPL
      exchange_code: NASD
      quantity_step: 1
      price_tick: 0.01
    - symbol: VOO
      asset_type: etf
      region: US
      currency: USD
      broker: kis
      broker_product: kis_overseas_stock
      broker_symbol: VOO
      exchange_code: AMEX
      quantity_step: 1
      price_tick: 0.01

strategies: []

datahub:
  provider: mock

execution:
  engine: paper

risk:
  max_single_asset_weight: 0.4
  min_cash_weight: 0.05

state:
  sqlite_path: var/kis_live_readonly_state.db

audit:
  jsonl_path: var/kis_live_readonly_audit.jsonl

approval:
  enabled: false
  provider: console
  require_approval: false
  default_decision: approved
  timeout_seconds: 300

kis:
  enabled: true
  provider: kis
  broker_product: kis_overseas_stock
  account_id: "12345678-01"
  app_key_env: KIS_APP_KEY
  app_secret_env: KIS_APP_SECRET
  access_token_env: KIS_ACCESS_TOKEN
  approval_key_env: KIS_APPROVAL_KEY
  token_cache_path: var/kis_access_token.json
  paper_trading: false

reconciliation:
  cash_tolerance: 0.0
  position_quantity_tolerance: 0.0
  value_tolerance: 0.0
