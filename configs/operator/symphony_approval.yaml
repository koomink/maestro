mode: live_approval
app_fragment_paths:
  - ../../../Virtuoso/Ataraxia/configs/fragments/ataraxia.yaml
strategy_account_map_path: strategy_accounts.yaml

portfolio:
  base_currency: KRW
  allocation_mode: currency_sleeves
  cash_by_currency:
