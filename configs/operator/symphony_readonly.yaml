mode: live_readonly
app_fragment_paths:
  - ../../../virtuoso/virtuoso-tranquillo/configs/fragments/tranquillo.yaml
strategy_account_map_path: strategy_accounts.yaml
broker_accounts_path: broker_accounts.yaml

portfolio:
  base_currency: KRW
  allocation_mode: currency_sleeves
  cash_by_currency:
    KRW: 0
    USD: 0
  unknown_broker_position_policy: include_readonly
  currency_sleeves:
    USD:
      cash_symbol: CASH_USD
      symbols:
        - QQQ
        - QQQM
        - SCHD
        - BIL
        - TLT
        - PDBC
        - TIP
        - SPY
        - SCZ
        - EFA
        - EEM
        - AGG
        - IEF
        - LQD

