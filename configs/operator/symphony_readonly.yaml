  policy:
    allowed_asset_types: [domestic_etf, etf, us_etf]
    allowed_regions: [KR, US]
    allowed_currencies: [KRW, USD]
    allowed_broker_products: [kis_domestic_stock, kis_overseas_stock]
    allowed_exchange_codes: [KRX, NASD, AMEX]
    denied_symbols: []
    denied_asset_tags: []
    max_new_symbols_per_run: 0
    require_operator_approval_for_tradable: true
    require_broker_tradability_check: true
    require_data_freshness_check: true
strategies:
  - id: tranquillo
    enabled: false
    weight: 1.0

  - id: crescendo_us
    enabled: false
    weight: 1.0
    entrypoint: "crescendo.strategy:CrescendoUSStrategy"
    config:
      sleeve: USD
      cash_symbol: CASH_USD

  - id: fugue
    enabled: false
    weight: 1.0
    entrypoint: "fugue.strategy:FugueStrategy"
    config:
      sleeve: USD
      cash_symbol: CASH_USD

datahub:
  providers:
    - name: yahoo_market
      provider: yahoo
      priority: 10
      data_types: [price, ohlcv, fundamental]
      timeout_seconds: 5
      stale_after_seconds: 604800
    - name: fred_macro
      provider: fred
      priority: 20
      data_types: [macro]
      api_key_env: FRED_API_KEY
      timeout_seconds: 5
      stale_after_seconds: 7776000
      symbol_map:
        T10Y3M: T10Y3M
        UNRATE: UNRATE

execution:
  proposal_engine: paper
  order_generation_mode: target_rebalance
  order_posture: disabled
  require_reconciliation_pass: true
  live_order_limits:
    max_order_notional_by_currency:
      KRW: 1000000
      USD: 1000
    max_daily_notional_by_currency:
      KRW: 10000000
      USD: 10000
    max_daily_order_count: 5
    daily_loss_limit_by_currency:
      KRW: 100000
      USD: 100
    fee_buffer_pct: 0.002
  allowed_order_type: limit
  order_status_poll_interval_seconds: 30
  order_status_max_polls: 20
  order_status_terminal_timeout_seconds: 1800
  market_session:
    required: false
    timezone: Asia/Seoul
    open: "09:00"
    close: "15:30"
    weekdays: [0, 1, 2, 3, 4]
    holidays: []
  broker_validation:
    require_quote_validation: true
    max_quote_deviation_pct: 0.02
    require_risk_validation: true

monitoring:
  heartbeat_max_age_seconds: 3600
  scheduled_run_max_age_seconds: 86400

state:
  sqlite_path: var/symphony_state.db
  identity_group: symphony

audit:
  jsonl_path: var/symphony_audit.jsonl

approval:
  enabled: false
  provider: telegram
  require_approval: false
  default_decision: expired
  timeout_seconds: 600
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_allowed_chat_ids: []
  whitelisted_user_ids: []
  telegram_poll_interval_seconds: 1.0
  telegram_reminder_seconds: [120, 300, 480]
