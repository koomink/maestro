  policy:
    allowed_asset_types: [etf, us_etf]
    allowed_regions: [US]
    allowed_currencies: [USD]
    allowed_broker_products: [kis_overseas_stock]
    allowed_exchange_codes: [NASD, AMEX]
    denied_symbols: []
    denied_asset_tags: []
    max_new_symbols_per_run: 0
    require_operator_approval_for_tradable: true
    require_broker_tradability_check: true
    require_data_freshness_check: true

strategies:
  - id: snowball_us
    enabled: true
    weight: 1.0
    entrypoint: "snowball.strategy:SnowballUSStrategy"
    config:
      sleeve: USD
      cash_symbol: CASH_USD
      selected_strategies:
        - dga
        - accelerated_dual_momentum
        - gtt_ue
        - baa_a

datahub:
  providers:
    - name: yahoo_market
      provider: yahoo
      priority: 10
      data_types: [price, ohlcv, fundamental]
      timeout_seconds: 5
      stale_after_seconds: 604800
    - name: fred_macro
      provider: fred
      priority: 20
      data_types: [macro]
      api_key_env: FRED_API_KEY
      timeout_seconds: 5
      stale_after_seconds: 7776000
      symbol_map:
        T10Y3M: T10Y3M
        UNRATE: UNRATE

execution:
  proposal_engine: paper
  order_generation_mode: target_rebalance
  order_posture: dry_run
  require_reconciliation_pass: true
  live_order_limits:
    max_order_notional: 1000
    max_daily_notional: 3000
    max_daily_order_count: 3
    daily_loss_limit: null
    fee_buffer_pct: 0.002
  allowed_order_type: limit
  order_status_poll_interval_seconds: 30
  order_status_max_polls: 20
  order_status_terminal_timeout_seconds: 1800
  market_session:
    required: true
    timezone: America/New_York
    open: "09:30"
    close: "16:00"
    weekdays: [0, 1, 2, 3, 4]
    holidays: []
  broker_validation:
    require_quote_validation: true
    max_quote_deviation_pct: 0.02
    require_risk_validation: true


monitoring:
  heartbeat_max_age_seconds: 3600
  scheduled_run_max_age_seconds: 86400

state:
  sqlite_path: var/kis_brokerage_us_state.db

audit:
  jsonl_path: var/kis_brokerage_us_audit.jsonl

approval:
  enabled: true
  provider: telegram
  require_approval: true
  default_decision: expired
  timeout_seconds: 300
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_allowed_chat_ids: []
  whitelisted_user_ids: []
  telegram_poll_interval_seconds: 1.0

kis:
  enabled: true
  provider: kis
  broker_product: kis_overseas_stock
  broker_products:
    - kis_overseas_stock
  account_id_env: KIS_BROKERAGE_ACCOUNT_ID
  app_key_env: KIS_APP_KEY
  app_secret_env: KIS_APP_SECRET
  access_token_env: KIS_ACCESS_TOKEN
  approval_key_env: KIS_APPROVAL_KEY
  token_cache_path: var/kis_brokerage_us_access_token.json
  paper_trading: false
  timeout_seconds: 10
  quote_market_code: J
